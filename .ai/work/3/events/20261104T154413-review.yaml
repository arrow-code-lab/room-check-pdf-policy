body: "The privacy policy now says completed tenant-mode inspections can't be deleted in the app (a narrowing of the user's deletion right), but nothing on the page announces it. Section 10 promises that material changes will be announced on the published page. 故障シナリオ: A user who read the earlier policy ('アプリ内で削除できる') gets no notice of the new limit. Only the date changes, which goes against the policy's own Section 10 on revisions.（出典: /code-review）"
