body: "Section 5 still names only in-app deletion or uninstalling as the end of retention, while Section 7 adds Android's 'ストレージを消去' (Clear storage) as a third way to delete everything. 故障シナリオ: A reader of Section 5 (JA line 93, EN line 198) sees two ways data stops being kept, but Section 7 lists three. The policy is inconsistent with itself, and fixing it means editing two places.（出典: /code-review）"
