at: terms.html:101
fix: "PR #4 の本文に確認事項として「利用規約 第 3 条の追記を第 12 条の変更に当たらないものとして同日適用とする判断（decision 20261104T154647-impl）」を挙げ、マージ前に運営者の確認を得る。変更に当たると判断されたら、改定履歴を効力発生日（公開日より後）の事前告知に書き換える"
state: open
summary: 利用規約の同日適用（第 12 条の事前告知を経ない）判断が人の確認待ちのまま
body: 前回の Major（20261104T154412-review.yaml）は、fix が許した「既存動作の説明で第 12 条の変更に当たらないと判断するなら decision に残して人の確認を取る」の経路で閉じられている（decision 20261104T154647-impl.yaml、改定履歴 terms.html:101-104 / :179-182 で同日適用を明示）。追記は入居者モードの完了点検が削除できないという既存の挙動（app_ja.arb finishNoticeTenant「完了したチェックは削除できず…」）の説明にとどまり、利用者の権利義務を新たに変えるものではないので、閉じ方自体は妥当と判断する。ただし decision は「法的判断として人の確認を求める」としており、確認はまだ取れていない。確認を経ずにマージすると、第 12 条（変更の内容と効力発生日の事前告知）と食い違うと受け取られる余地が残る。
