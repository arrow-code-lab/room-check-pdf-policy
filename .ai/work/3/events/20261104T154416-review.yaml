summary: 物件・号室の個別削除は物件管理モードだけの機能だが、モードを書いていない
body: "The deletion bullet says properties and units (物件・号室) can be deleted individually 'in the app', but those screens exist only in property-management mode. A tenant-mode user has no such screens. 故障シナリオ: A tenant-mode user reads that properties and units can be deleted and can't find the feature. The sentence should say which mode allows it, as the next sentence already does for tenant mode.（出典: /code-review）"
